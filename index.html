<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2C5BA8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Inglês S&C">
<title>Inglês Suzana e Celso ❤️</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F6FA; --surface:#FFFFFF; --ink:#16223A; --muted:#5A6579; --line:#D9E0EA;
  --blue:#2C5BA8; --blue-soft:#E3ECFA; --red:#C93B35; --red-soft:#FBE6E4;
  --green:#24845D; --green-soft:#E1F3EA; --on-accent:#FFFFFF;
  --shadow:0 1px 2px rgba(22,34,58,.06),0 10px 28px rgba(22,34,58,.07);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F1522; --surface:#182133; --ink:#E7ECF4; --muted:#9AA5B8; --line:#2A3650;
    --blue:#86A9EA; --blue-soft:#1E2C48; --red:#F07B73; --red-soft:#3A2023;
    --green:#5FC89B; --green-soft:#16302A; --on-accent:#0F1522; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1522; --surface:#182133; --ink:#E7ECF4; --muted:#9AA5B8; --line:#2A3650;
  --blue:#86A9EA; --blue-soft:#1E2C48; --red:#F07B73; --red-soft:#3A2023;
  --green:#5FC89B; --green-soft:#16302A; --on-accent:#0F1522; --shadow:none; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.55 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
h1,h2,h3{font-family:"Bricolage Grotesque","Atkinson Hyperlegible",system-ui,sans-serif;line-height:1.15;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 104px}

/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding:10px 16px;border-bottom:1px solid var(--line)}
.top-in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px;justify-content:space-between}
.brand{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:18px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;flex-shrink:0}
.who button{border:0;background:transparent;padding:6px 12px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted)}
.who button[aria-pressed="true"]{background:var(--blue);color:var(--on-accent)}

.brand{display:flex;align-items:center;gap:8px}
.brand img{width:30px;height:30px;border-radius:8px;object-fit:cover;flex-shrink:0}
.photo{position:relative;margin:-14px -10px 18px;border-radius:10px;overflow:hidden;aspect-ratio:4/3;background:var(--blue-soft)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.dl{display:flex;align-items:center;gap:12px;margin-top:14px;background:var(--surface);border:1.5px solid var(--blue);border-radius:12px;padding:12px 14px;width:100%;text-align:left;color:var(--ink)}
.dl img{width:46px;height:46px;border-radius:11px;object-fit:cover}
.dl b{display:block}.dl span{font-size:14px;color:var(--muted)}
.dl .go{margin-left:auto;background:var(--blue);color:var(--on-accent);border-radius:9px;padding:8px 12px;font-weight:700;font-size:15px;white-space:nowrap}
.sheet-bg{position:fixed;inset:0;background:rgba(10,15,25,.5);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
.sheet h2{font-size:21px}
.sheet .ico{display:flex;gap:14px;align-items:center;margin:14px 0}
.sheet .ico img{width:72px;height:72px;border-radius:17px;object-fit:cover;box-shadow:var(--shadow)}
.steps{margin:6px 0 0;padding-left:20px;font-size:15px}.steps li{margin:3px 0}
.opt{border-top:1px solid var(--line);padding:14px 0}
.opt h3{font-size:16px;margin-bottom:4px}
/* cartão-postal (elemento de assinatura) */
.postcard{position:relative;background:var(--surface);border-radius:16px;padding:26px 22px 22px;box-shadow:var(--shadow);overflow:hidden}
.postcard::before{content:"";position:absolute;inset:0;border-radius:16px;padding:8px;
  background:repeating-linear-gradient(-45deg,var(--red) 0 11px,transparent 11px 17px,var(--blue) 17px 28px,transparent 28px 34px);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);pointer-events:none}
.stamp{position:absolute;top:24px;right:24px;z-index:2;background:var(--surface);width:74px;height:86px;border:2px dashed var(--red);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(4deg);color:var(--red);text-align:center;line-height:1.1}
.stamp b{font-family:"Bricolage Grotesque",sans-serif;font-size:26px}
.stamp small{font-size:12px}
.greet{font-size:30px;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--muted);margin:6px 0 0}
.route{margin-top:22px}
.route-bar{position:relative;height:8px;background:var(--blue-soft);border-radius:99px}
.route-bar span{position:absolute;inset:0 auto 0 0;background:var(--blue);border-radius:99px}
.route-marks{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:6px}
.route-marks b{color:var(--ink)}
.facts{display:flex;gap:18px;margin-top:16px;flex-wrap:wrap}
.facts div{font-size:14px;color:var(--muted)}
.facts strong{display:block;font-size:22px;color:var(--ink);font-family:"Bricolage Grotesque",sans-serif}

/* blocos */
.sec{margin-top:26px}
.sec h2{font-size:21px;margin-bottom:10px}
.hint{color:var(--muted);font-size:15px;margin:4px 0 12px}
.plan{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.plan li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 14px 14px 16px;display:flex;gap:12px;align-items:center}
.plan .num{width:30px;height:30px;border-radius:50%;background:var(--blue-soft);color:var(--blue);font-weight:700;display:grid;place-items:center;flex-shrink:0}
.plan .txt{flex:1;min-width:0}
.plan .txt b{display:block}
.plan .txt span{color:var(--muted);font-size:14px}
.plan li.done .num{background:var(--green-soft);color:var(--green)}

.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700;background:var(--blue);color:var(--on-accent);min-height:44px}
.btn.ghost{background:transparent;color:var(--blue);border:1.5px solid var(--blue)}
.btn.quiet{background:var(--blue-soft);color:var(--blue)}
.btn.small{padding:7px 12px;min-height:36px;font-size:15px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* trilha */
.phase{margin-top:22px}
.phase-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:8px}
.phase-head h3{font-size:18px}
.phase-head span{font-size:14px;color:var(--muted);white-space:nowrap}
.unit{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.unit .m{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;color:var(--muted);font-size:14px;text-align:center;line-height:1.1}
.unit .m b{display:block;font-size:22px;color:var(--ink)}
.unit.now .m b{color:var(--red)}
.unit .t b{display:block}
.unit .t span{font-size:14px;color:var(--muted)}
.mini{height:5px;background:var(--blue-soft);border-radius:9px;margin-top:6px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--green)}

/* prática */
.prac-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.prac-head h2{font-size:19px}
.count{color:var(--muted);font-size:14px;white-space:nowrap}
.modes{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}
.card{background:var(--surface);border-radius:16px;padding:22px 20px;box-shadow:var(--shadow);border:1px solid var(--line)}
.en{font-family:"Bricolage Grotesque",sans-serif;font-size:27px;font-weight:700;line-height:1.25;letter-spacing:-.01em}
.pt{color:var(--muted);font-size:18px;margin-top:10px}
.hidden-line{color:var(--muted);font-style:italic;font-size:16px}
.mic{display:flex;flex-direction:column;align-items:center;margin:22px 0 6px;gap:8px}
.mic button{width:84px;height:84px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:30px;display:grid;place-items:center;box-shadow:0 6px 18px rgba(201,59,53,.28)}
.mic button.on{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 14px rgba(201,59,53,.15)}}
@media (prefers-reduced-motion:reduce){.mic button.on{animation:none;outline:4px solid var(--red-soft)}}
.mic small{color:var(--muted);font-size:14px}
.live{min-height:26px;text-align:center;color:var(--muted);font-style:italic}
.result{margin-top:14px;border-radius:12px;padding:14px 16px;background:var(--paper);border:1px solid var(--line)}
.score{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:30px}
.score.good{color:var(--green)} .score.mid{color:var(--blue)} .score.low{color:var(--red)}
.diff{font-size:19px;line-height:1.7;margin-top:4px}
.diff .ok{color:var(--green)}
.diff .miss{color:var(--red);text-decoration:underline wavy;text-underline-offset:4px}
.heard{color:var(--muted);font-size:15px;margin-top:6px}
.ai{margin-top:12px;border-left:4px solid var(--blue);padding:8px 0 8px 12px;font-size:16px}
.ai p{margin:4px 0}
details.type{margin-top:10px}
details.type summary{color:var(--blue);font-weight:700;cursor:pointer;font-size:15px}
.type-row{display:flex;gap:8px;margin-top:8px}
.type-row input,.chat-in input{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:44px}
.foot{display:flex;justify-content:space-between;gap:8px;margin-top:16px}

/* conversa */
select{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:44px;max-width:100%}
.chat{display:flex;flex-direction:column;gap:10px;margin:14px 0}
.msg{max-width:88%;padding:11px 14px;border-radius:14px;font-size:17px}
.msg.bot{background:var(--surface);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:var(--blue);color:var(--on-accent);align-self:flex-end;border-bottom-right-radius:4px}
.msg .tr{display:block;color:var(--muted);font-size:14px;margin-top:6px}
.msg .fix{display:block;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:15px;color:var(--red)}
.msg .say{border:0;background:transparent;color:var(--blue);font-weight:700;font-size:14px;padding:4px 0 0}
.chat-in{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;background:var(--paper);padding:8px 0}
.round{width:46px;height:46px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:20px;flex-shrink:0}
.round.on{animation:pulse 1.2s ease-in-out infinite}

/* método */
.method{display:grid;gap:12px}
.method div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.method b{display:block;margin-bottom:2px}
.method span{color:var(--muted);font-size:15px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:15px;min-width:420px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:"Bricolage Grotesque",sans-serif}
tr:last-child td{border-bottom:0}

.note{font-size:14px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;margin-top:12px}

/* navegação inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{border:0;background:transparent;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:700;color:var(--muted)}
.nav button span{font-size:20px;line-height:1}
.nav button[aria-current="page"]{color:var(--blue)}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:15px;z-index:20;max-width:90vw}
</style>
</head>

/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dstr(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return dstr(d)};
const daysBetween=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2800)}

/* ---------- estado ---------- */
const fresh=()=>({v:1,start:today(),best:{},cards:{},extra:{},days:{},streak:0,lastDay:null,updatedAt:0});
let profile=lsGet('isc:profile')||'celso';
let S=loadLocal(profile);
let tab='hoje', session=null, convo={unit:null,msgs:[],busy:false};
let sample=null, db=null, uid=null, downloads=null, sheetOpen=false;

function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function loadLocal(p){try{const r=JSON.parse(lsGet('isc:'+p)||'null');return r?Object.assign(fresh(),r):fresh()}catch(e){return fresh()}}
function save(){S.updatedAt=Date.now();lsSet('isc:'+profile,JSON.stringify(S));pushCloud()}

/* nuvem: progresso de cada pessoa fica na área privada da conta */
let pushT=null,writing=false,again=false;
function pushCloud(){if(!db||!uid)return;clearTimeout(pushT);pushT=setTimeout(doPush,1500)}
async function doPush(){
  if(writing){again=true;return}
  writing=true;
  try{await db.collection('data/users/'+uid).doc(profile).set(JSON.parse(JSON.stringify(S)))}catch(e){}
  writing=false; if(again){again=false;doPush()}
}
async function pullCloud(){

/* ---------- conteúdo derivado ---------- */
function phrasesOf(u){
  const base=u.p.map((x,i)=>({id:u.id+'-'+i,en:x[0],pt:x[1],u:u.id}));
  const ex=(S.extra[u.id]||[]).map((x,i)=>({id:u.id+'-x'+i,en:x.en,pt:x.pt,u:u.id}));
  return base.concat(ex);
}
function allPhrases(){return UNITS.flatMap(phrasesOf)}
function findPhrase(id){return allPhrases().find(p=>p.id===id)}
function unitStats(u){const ps=phrasesOf(u);const ok=ps.filter(p=>(S.best[p.id]||0)>=PASS).length;return{ok,total:ps.length,done:ok>=ps.length}}
function unitsDone(){return UNITS.filter(u=>unitStats(u).done).length}
function dayNum(){return Math.max(1,daysBetween(S.start,today())+1)}
function monthNow(){return Math.min(12,Math.floor((dayNum()-1)/30)+1)}
function currentUnit(){
  const m=monthNow();
  const pending=UNITS.find(u=>u.m<=m&&!unitStats(u).done);
  return pending||UNITS.find(u=>u.m===m)||UNITS[11];
}
function levelLabel(){const d=unitsDone();return d>=12?'B1':d>=9?'A2+':d>=6?'A2':d>=3?'A1+':'A1'}
function dueCards(){const t=today();return Object.entries(S.cards).filter(([,c])=>c.due<=t).map(([id])=>id).filter(findPhrase)}
function todayCount(){return S.days[today()]||0}
const GOAL=15;

function bumpDay(){const t=today();S.days[t]=(S.days[t]||0)+1;if(S.lastDay!==t){S.streak=(S.lastDay===addDays(t,-1))?S.streak+1:1;S.lastDay=t}save()}
function record(pid,score){
  const t=today();
  S.best[pid]=Math.max(S.best[pid]||0,score);
  const c=S.cards[pid]||{box:0,due:t};
  c.box=score>=PASS?Math.min(c.box+1,INTERVALS.length-1):1;
  c.due=addDays(t,INTERVALS[c.box]);
  S.cards[pid]=c;
  S.days[t]=(S.days[t]||0)+1;
  if(S.lastDay!==t){S.streak=(S.lastDay===addDays(t,-1))?S.streak+1:1;S.lastDay=t}
  save();
}

/* ---------- comparação de fala ---------- */
const CONTR={"i'm":"i am","you're":"you are","we're":"we are","they're":"they are","it's":"it is","that's":"that is","don't":"do not","didn't":"did not","doesn't":"does not","isn't":"is not","aren't":"are not","can't":"cannot","won't":"will not","i'll":"i will","we'll":"we will","you'll":"you will","i'd":"i would","we'd":"we would","i've":"i have","we've":"we have","there's":"there is","what's":"what is","haven't":"have not","wasn't":"was not","let's":"let us","where's":"where is","how's":"how is"};
const NUM={"0":"zero","1":"one","2":"two","3":"three","4":"four","5":"five","6":"six","7":"seven","8":"eight","9":"nine","10":"ten","11":"eleven","12":"twelve","20":"twenty"};
function toks(w){
  w=w.toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9' -]/g,'').replace(/-/g,' ').trim();
  if(!w)return[];
  return w.split(/\s+/).flatMap(x=>{x=x.replace(/^'+|'+$/g,'');if(CONTR[x])return CONTR[x].split(' ');if(NUM[x])return[NUM[x]];if(x==='ok'||x==='okay')return['okay'];return x?[x]:[]});
}
function compare(target,said){
  const words=target.split(/\s+/);
  const flat=[];words.forEach((w,i)=>toks(w).forEach(t=>flat.push({t,i})));
  const s=toks(said.replace(/\bcan not\b/gi,'cannot'));
  const n=flat.length,m=s.length;
  const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=flat[i].t===s[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const hit=new Array(n).fill(false);let i=0,j=0;
  while(i<n&&j<m){if(flat[i].t===s[j]){hit[i]=true;i++;j++}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++}
  const wordOk=words.map((_,wi)=>flat.filter(f=>f.i===wi).every((f,k)=>hit[flat.indexOf(f)]));
  const matched=hit.filter(Boolean).length;
  const extra=Math.max(0,m-matched);
  const score=n?Math.max(0,Math.round(100*(matched-0.25*extra)/n)):0;
  return{score:Math.min(100,score),words,wordOk};
}

/* ---------- voz ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null;
function listen(onInterim){
  return new Promise((res,rej)=>{
    if(!SR){rej('unsupported');return}
    const r=new SR();rec=r;
    r.lang='en-US';r.interimResults=true;r.continuous=false;r.maxAlternatives=1;
    let txt='';
    r.onresult=e=>{let t='';for(const x of e.results)t+=x[0].transcript;txt=t;onInterim&&onInterim(t)};
    r.onerror=e=>{rec=null;rej(e.error||'error')};
    r.onend=()=>{rec=null;res(txt)};
    try{r.start()}catch(e){rec=null;rej('start')}
  });
}
function micError(code){
  if(code==='unsupported')return'Este navegador não reconhece voz. Use o Chrome (Android/computador) ou o Safari no iPhone, ou digite a frase.';
  if(code==='not-allowed'||code==='service-not-allowed')return'O microfone foi bloqueado. Libere o microfone para este site ou abra o app na página própria dele; enquanto isso, digite a frase.';
  if(code==='no-speech')return'Não ouvi nada. Toque no microfone e fale logo em seguida.';
  return'Não consegui ouvir agora. Tente de novo ou digite a frase.';
}
let voice=null;
function pickVoice(){
  if(!('speechSynthesis' in window))return;
  const vs=speechSynthesis.getVoices().filter(v=>/^en[-_]US/i.test(v.lang));
  voice=vs.find(v=>/Samantha|Google US English|Aria|Jenny|Ava/i.test(v.name))||vs[0]||null;
}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function speak(text,rate){
  if(!('speechSynthesis' in window)){toast('Este navegador não tem leitura em voz alta.');return}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=rate||0.95;if(voice)u.voice=voice;
  speechSynthesis.speak(u);
}

/* ---------- IA ---------- */
function aiErr(e){
  const c=e&&e.code;
  if(c==='not_granted')return'O uso da IA não foi autorizado nesta sessão.';
  if(c==='rate_limited')return'Muitas solicitações seguidas. Aguarde um minuto.';
  return'Não foi possível falar com a IA agora. Tente de novo em instantes.';
}
async function aiCorrect(p,mode,said){
  const prompt=`Você é professor de inglês para brasileiros adultos (nível ${levelLabel()}, meta: B1 em 12 meses para viajar).
Modo: ${mode==='read'?'o aluno leu a frase em inglês em voz alta':'o aluno viu a frase em português e tentou dizê-la em inglês, de memória'}.
Frase em inglês de referência: "${p.en}"
Frase em português: "${p.pt}"
O que o reconhecimento de voz transcreveu: "${said}"
Palavras trocadas ou faltando na transcrição costumam indicar pronúncia pouco clara. No modo tradução, aceite outras formas corretas e naturais.
Responda SOMENTE com JSON, sem texto fora dele:
{"nota":0-100,"comentario":"em português, 1 a 2 frases diretas sobre o que acertou e o que ajustar","pronuncia":"em português, 1 dica concreta de som ou palavra (ex.: th, -ed, vogal longa), ou string vazia","alternativa":"uma forma natural em inglês de dizer a mesma coisa"}`;
  return sample.json(prompt,{modelTier:'quick'});
}
async function aiConvo(u,msgs){
  const hist=msgs.map(m=>(m.me?'Aluno: ':'Você: ')+m.en).join('\n');
  const prompt=`Você é ${u.role}, conversando em inglês com um turista brasileiro adulto (nível ${levelLabel()}, meta B1). Tema: ${u.t} (${u.d}).
Regras: fale inglês simples e natural, no máximo 2 frases curtas, sempre termine com uma pergunta que faça o aluno falar. Mantenha o papel.
Se a última fala do aluno tiver erro de gramática ou vocabulário, explique em português em 1 frase e mostre a forma correta em inglês. Se estiver correta, deixe "correcao" vazio.
${hist?'Conversa até agora:\n'+hist:'Comece a conversa você, com uma saudação e uma pergunta simples.'}
Responda SOMENTE com JSON: {"reply":"sua fala em inglês","pt":"tradução da sua fala para português","correcao":"string em português ou vazia"}`;
  return sample.json(prompt,{modelTier:'quick',cache:false});
}
async function aiMore(u){
  const have=phrasesOf(u).map(p=>p.en).join(' | ');
  const prompt=`Crie 6 frases novas em inglês para brasileiros adultos que estudam para viajar, tema "${u.t}" (${u.d}), nível ${u.m<=6?'A1-A2':'A2-B1'}.
Frases úteis no mundo real, 5 a 14 palavras, sem repetir estas: ${have}
Responda SOMENTE com JSON: [{"en":"...","pt":"tradução natural em português do Brasil"}]`;
  const r=await sample.json(prompt,{modelTier:'quick',cache:false});
  return(Array.isArray(r)?r:[]).filter(x=>x&&typeof x.en==='string'&&typeof x.pt==='string').slice(0,6).map(x=>({en:x.en.trim().slice(0,160),pt:x.pt.trim().slice(0,200)}));
}

async function doListen(){
  if(rec){try{rec.stop()}catch(e){}return}
  session.listening=true;session.live='';render();

function check(said){
  const it=session.items[session.i];

  session.said=said;session.res=r;session.ai=null;session.showEn=true;session.showPt=true;
  record(it.p.id,r.score);
  if(r.score>=PASS)speak(it.p.en,0.95);

  <p class="hint">Situação real com um personagem. Ele responde curto, faz perguntas e corrige você em português quando precisar.</p>
  <div class="row"><label for="scene" class="hint" style="margin:0">Cenário</label>
    <select id="scene" data-act="scene">${UNITS.map(x=>`<option value="${x.id}" ${x.id===u.id?'selected':''}>Mês ${x.m}: ${esc(x.t)}</option>`).join('')}</select></div>
  <div class="chat">
    ${convo.msgs.map(m=>m.me?`<div class="msg me" lang="en">${esc(m.en)}${m.fix?`<span class="fix" style="color:inherit;opacity:.95">✏️ ${esc(m.fix)}</span>`:''}</div>`
      :`<div class="msg bot"><span lang="en">${esc(m.en)}</span><span class="tr">${esc(m.pt)}</span><button class="say" data-act="say" data-v="${esc(m.en)}">🔊 Ouvir de novo</button></div>`).join('')}
    ${convo.busy?'<div class="msg bot"><span class="tr">Pensando…</span></div>':''}
    <div id="chatEnd"></div>
  </div>
  ${convo.msgs.length===0&&!convo.busy?`<button class="btn" data-act="cstart">Começar conversa</button>`:`
  <div class="chat-in">
    <button class="round ${convoListening?'on':''}" data-act="clisten" aria-label="Falar">${convoListening?'■':'🎙️'}</button>
    <input id="chatText" lang="en" autocomplete="off" placeholder="Responda em inglês" ${convo.busy?'disabled':''}>
    <button class="btn" data-act="csend" ${convo.busy?'disabled':''}>Enviar</button>
  </div>
  <div class="row" style="margin-top:6px"><button class="btn small ghost" data-act="creset">Nova conversa</button></div>`}`;
}
function vMetodo(){
  return `<h1 style="font-size:26px">Como a trilha funciona</h1>
  <p class="hint">Meta de 12 meses: chegar ao B1 (intermediário) com foco em conversação de viagem. Depois, a mesma rotina leva à fluência.</p>
  <div class="method">
    <div><b>Shadowing</b><span>Ouvir a frase e repetir logo em seguida, imitando ritmo e entonação. É o modo “Ler em voz alta”.</span></div>
    <div><b>Recordação ativa</b><span>Ver em português e produzir em inglês de memória. Fixa muito mais que reler. É o modo “Traduzir falando” e a Revisão.</span></div>
    <div><b>Repetição espaçada</b><span>Cada frase volta em 1, 2, 4, 8, 16, 32 dias. Errou, volta para o começo. O app calcula sozinho.</span></div>
    <div><b>Blocos prontos (chunks)</b><span>Aprender frases inteiras de uso real, não palavras soltas. Gramática entra pelo uso.</span></div>
    <div><b>Conversa com propósito</b><span>Simulações das situações do mês, com correção imediata e sem medo de errar.</span></div>
    <div><b>Input compreensível</b><span>Fora do app: séries com legenda em inglês e podcasts para iniciantes, 15 minutos por dia.</span></div>
  </div>
  <section class="sec"><h2>Semana tipo</h2>
  <div class="tbl"><table>
    <tr><th>Dia</th><th>No app (20 a 30 min)</th><th>Fora do app</th></tr>
    <tr><td>Seg a Sex</td><td>Revisão, unidade do mês, 5 min de conversa</td><td>15 min de série ou podcast</td></tr>
    <tr><td>Qua e Sáb</td><td>Role-play do casal com a unidade do mês</td><td>Sem português por 10 min</td></tr>
    <tr><td>Sábado</td><td>Revisão geral</td><td>Aula de conversação com professor (1x/semana)</td></tr>
    <tr><td>Domingo</td><td>Folga ou só revisão</td><td>Filme com legenda em inglês</td></tr>
  </table></div></section>
  <section class="sec"><h2>Marcos de controle</h2>
  <div class="tbl"><table>
    <tr><th>Mês</th><th>Marco</th><th>Como medir</th></tr>
    <tr><td>3</td><td>Sobreviver em aeroporto e hotel</td><td>Unidades 1 a 3 concluídas; teste de nível online gratuito</td></tr>
    <tr><td>6</td><td>A2: resolver o dia a dia</td><td>Unidades 4 a 6; conversa de 10 min sem travar</td></tr>
    <tr><td>9</td><td>Contar uma história no passado</td><td>Narrar a última viagem em 2 minutos</td></tr>
    <tr><td>12</td><td>B1: viagem sem passar vergonha</td><td>Novo teste de nível; viagem de “formatura”</td></tr>
  </table></div></section>
  <section class="sec"><h2>Instalar no celular</h2>
  <p class="hint">Cada um escolhe seu nome no topo; o progresso fica separado.</p>
  <button class="dl" data-act="sheet"><img src="${IMG_ICON}" alt=""><span><b>Baixar o app</b><span>Passo a passo e ícone com a nossa foto</span></span><span class="go">Baixar</span></button></section>`;
}
let deferredPrompt=null;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isStandalone=()=>window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e});
window.addEventListener('appinstalled',()=>{deferredPrompt=null;toast('App instalado na tela inicial.');render()});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
async function installApp(){
  if(isStandalone()){toast('O app já está na tela inicial.');return}
  if(deferredPrompt){deferredPrompt.prompt();const r=await deferredPrompt.userChoice;deferredPrompt=null;if(r.outcome!=='accepted')toast('Instalação cancelada.');return}
  if(isIOS){iosGuide();return}
  openSheet();
}
function iosGuide(){
  sheetOpen=true;
  let el=document.getElementById('sheet');
  if(!el){el=document.createElement('div');el.id='sheet';el.className='sheet-bg';document.body.appendChild(el)}
  el.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetT">
    <div class="row" style="justify-content:space-between"><h2 id="sheetT">Falta um toque</h2><button class="btn small ghost" data-act="sheetclose">Fechar</button></div>
    <div class="ico"><img src="icon-180.png" alt="Ícone do app"><div class="hint" style="margin:0">No iPhone a Apple não deixa o site instalar sozinho. São 2 toques e o ícone já vem com a nossa foto.</div></div>
    <ol class="steps" style="font-size:17px"><li>Toque em <b>Compartilhar</b> <span aria-hidden="true">⬆️</span> na barra do Safari, aqui embaixo.</li><li>Toque em <b>Adicionar à Tela de Início</b> e depois em <b>Adicionar</b>.</li></ol>
    <p class="hint" style="text-align:center;font-size:28px;margin:14px 0 0" aria-hidden="true">⬇️</p></div>`;
  el.onclick=ev=>{if(ev.target===el)closeSheet()};
}
function openSheet(){
  sheetOpen=true;
  let el=document.getElementById('sheet');
  if(!el){el=document.createElement('div');el.id='sheet';el.className='sheet-bg';document.body.appendChild(el)}
  el.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetT">
    <div class="row" style="justify-content:space-between"><h2 id="sheetT">Baixar o app</h2><button class="btn small ghost" data-act="sheetclose">Fechar</button></div>
    <div class="ico"><img src="${IMG_ICON}" alt="Ícone do app"><div><b>Inglês Suzana e Celso ❤️</b><div class="hint" style="margin:2px 0 0">Este é o ícone que vai aparecer na tela do celular.</div></div></div>
    <div class="opt"><h3>iPhone, com a nossa foto no ícone</h3>
      <ol class="steps"><li>Toque em <b>Baixar ícone</b> abaixo e salve a foto.</li><li>Copie o link deste app (botão Compartilhar do Claude).</li><li>Abra o app <b>Atalhos</b>, toque em <b>+</b>, escolha <b>Abrir URLs</b> e cole o link.</li><li>No topo, toque no nome do atalho, depois em <b>Adicionar à Tela de Início</b>, toque no ícone e escolha a foto salva.</li><li>Nome: <b>Inglês S&amp;C ❤️</b>. Pronto.</li></ol>
      ${downloads?'<button class="btn small" style="margin-top:8px" data-act="dlicon">Baixar ícone</button>':''}</div>
    <div class="opt"><h3>Android</h3>
      <ol class="steps"><li>Abra o link do app no <b>Chrome</b>.</li><li>Menu <b>⋮</b> e depois <b>Adicionar à tela inicial</b> (ou <b>Instalar app</b>).</li><li>Se o ícone não vier com a foto, use um app de atalhos (ex.: Shortcut Maker) e escolha o ícone baixado.</li></ol>
      ${downloads?'<button class="btn small" style="margin-top:8px" data-act="dlicon">Baixar ícone</button>':''}</div>
    ${downloads?`<div class="opt"><h3>Arquivo do app (funciona offline)</h3>
      <p class="hint" style="margin:0 0 8px">Abre direto no navegador, sem internet. Trilha, revisão e voz funcionam; a conversa com IA só dentro do Claude. O progresso do arquivo fica no próprio aparelho.</p>
      <button class="btn small quiet" data-act="dlfile">Baixar arquivo do app</button></div>`:''}
  </div>`;
  el.onclick=ev=>{if(ev.target===el)closeSheet()};
}
function closeSheet(){sheetOpen=false;const el=document.getElementById('sheet');if(el)el.remove()}
async function saveFile(filename,data){
  try{const r=await downloads.save({filename,data});if(r&&r.status==='saved')toast('Arquivo salvo.')}
  catch(e){if(e&&e.code==='unavailable'){downloads=null;openSheet()}else if(!(e&&/declin|cancel/i.test(e.code||'')))toast('Não foi possível baixar agora.')}
}
async function dlIcon(){const b=await (await fetch(IMG_ICON)).blob();saveFile('icone-ingles-suzana-celso.jpg',b)}
function dlFile(){
  const c=document.documentElement.cloneNode(true);
  c.querySelector('#app').innerHTML='';
  c.querySelectorAll('#sheet,.toast').forEach(x=>x.remove());
  saveFile('Ingles-Suzana-e-Celso.html','<!doctype html>\n'+c.outerHTML);
}
function render(){
  document.querySelectorAll('.who button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===profile));
  document.querySelectorAll('.nav button').forEach(b=>{if(b.dataset.v===(tab==='pratica'?'hoje':tab))b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  const v={hoje:vHoje,trilha:vTrilha,pratica:vPratica,conversa:vConversa,metodo:vMetodo}[tab]||vHoje;
  $('#app').innerHTML=v();
}

/* ---------- eventos ---------- */
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b||b.tagName==='SELECT')return;
  const a=b.dataset.act,v=b.dataset.v;
  if(a==='sheet'){installApp();return}
  if(a==='sheetclose'){closeSheet();return}
  if(a==='dlicon'){dlIcon();return}
  if(a==='dlfile'){dlFile();return}
  if(a==='tab'){if(rec)try{rec.abort()}catch(_){}tab=v;session=null;render();window.scrollTo(0,0)}
  else if(a==='who'){if(v===profile)return;profile=v;lsSet('isc:profile',v);S=loadLocal(v);session=null;convo={unit:null,msgs:[],busy:false};if(tab==='pratica')tab='hoje';render();pullCloud()}
  else if(a==='unit')startUnit(v);
  else if(a==='review')startReview();
  else if(a==='talk'){tab='conversa';convo={unit:v,msgs:[],busy:false};render();window.scrollTo(0,0)}
  else if(a==='say')speak(v,0.95);
  else if(a==='slow')speak(session.items[session.i].p.en,0.7);
  else if(a==='showpt'){session.showPt=!session.showPt;render()}
  else if(a==='showen'){session.showEn=!session.showEn;render()}
  else if(a==='mode'){session.items[session.i].mode=v;resetItem();render()}
  else if(a==='listen')doListen();
  else if(a==='typed'){const t=$('#typed').value.trim();if(t)check(t)}
  else if(a==='aicorr')doAiCorrect();
  else if(a==='again'){resetItem();render()}
  else if(a==='next'){if(session.i+1<session.items.length){session.i++;resetItem();render();window.scrollTo(0,0)}else{toast('Sessão concluída. Good job!');endSession()}}
  else if(a==='end')endSession();
  else if(a==='more'){
    b.disabled=true;b.textContent='Gerando…';
    const u=UNITS.find(x=>x.id===v);
    try{const novas=await aiMore(u);if(novas.length){S.extra[v]=(S.extra[v]||[]).concat(novas);save();toast(novas.length+' frases novas em '+u.t)}else toast('A IA não devolveu frases válidas. Tente de novo.')}
    catch(err){toast(aiErr(err))}
    render();
  }
  else if(a==='cstart')convoTurn(null);
  else if(a==='csend'){const i=$('#chatText');const t=i&&i.value.trim();if(t){i.value='';convoTurn(t)}}
  else if(a==='clisten')convoListen();
  else if(a==='creset'){convo.msgs=[];render()}
});
document.addEventListener('change',e=>{if(e.target.id==='scene'){convo={unit:e.target.value,msgs:[],busy:false};render()}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&sheetOpen){closeSheet();return}
  if(e.key!=='Enter')return;
  if(e.target.id==='typed'){e.preventDefault();const t=e.target.value.trim();if(t)check(t)}
  if(e.target.id==='chatText'&&!convo.busy){e.preventDefault();const t=e.target.value.trim();if(t){e.target.value='';convoTurn(t)}}
});
render();
</script>
</body>
</html>
